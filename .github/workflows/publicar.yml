name: Publicar en Instagram
on:
  schedule:
    - cron: "0 19 * * *"      # 20:00 en España en invierno (21:00 en verano)
  workflow_dispatch:
    inputs:
      fecha:
        description: "Publicar lo de este día (AAAA-MM-DD). Vacío = hoy"
        required: false
      prueba:
        description: "Solo comprobar, sin publicar"
        type: boolean
        default: true
permissions:
  contents: write
concurrency: instagram
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publicar lo que toca
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          BASE_URL: ${{ vars.BASE_URL }}
          FECHA: ${{ inputs.fecha }}
          PRUEBA: ${{ inputs.prueba && '1' || '0' }}
        run: python tools/publicar.py
      - name: Guardar registro
        run: |
          git config user.name "extrapass-bot"
          git config user.email "extrapass-bot@users.noreply.github.com"
          git add contenido/publicados.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Publicado en Instagram" && git push)
