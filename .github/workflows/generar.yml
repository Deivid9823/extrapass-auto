name: Generar contenido
on:
  schedule:
    - cron: "0 8 * * 0"       # cada domingo a las 9:00 (España)
  workflow_dispatch:
    inputs:
      semanas:
        description: "Semanas a generar"
        default: "4"
permissions:
  contents: write
concurrency: contenido
jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: ¿Hace falta?
        id: falta
        run: |
          ultimo=$(python3 -c "import json;print(json.load(open('contenido/usados.json')).get('ultimo') or '2000-01-01')")
          limite=$(date -u -d "+14 days" +%F)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [[ "$ultimo" < "$limite" ]]; then echo "si=1" >> $GITHUB_OUTPUT; else echo "Hay contenido hasta $ultimo: no hace falta generar."; fi
      - uses: actions/setup-node@v4
        if: steps.falta.outputs.si == '1'
        with:
          node-version: "20"
      - name: Instalar navegador y ffmpeg
        if: steps.falta.outputs.si == '1'
        run: |
          npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-inter || sudo apt-get install -y -qq ffmpeg
      - name: Generar
        if: steps.falta.outputs.si == '1'
        run: node tools/generar.js ${{ inputs.semanas || '4' }}
      - name: Guardar
        if: steps.falta.outputs.si == '1'
        run: |
          git config user.name "extrapass-bot"
          git config user.email "extrapass-bot@users.noreply.github.com"
          git add contenido
          git diff --cached --quiet || (git commit -m "Contenido nuevo para Instagram" && git push)
