<title>Extra Pass</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: una sola columna centrada. La pista es la protagonista; debajo, la línea de pasos y tres botones grandes. */
:root{
  --bg:#EFF1EC; --panel:#FFFFFF; --panel-2:#F3F5F0; --line:#D7DDD4; --fg:#151C17; --muted:#5D6A61;
  --accent:#E0481F; --accent-fg:#FFFFFF; --def:#1C4FA0; --ball:#F08A24;
  --court:#E8CB9C; --court-2:#DFBE8A; --court-line:#3A2E21; --paint:#D9B27C;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif; --body:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1411; --panel:#18201B; --panel-2:#202A23; --line:#2E3A32; --fg:#ECF1EC; --muted:#98A59C;
  --accent:#F2643B; --accent-fg:#1A0A04; --def:#7AA8F2; --ball:#F5A04A; color-scheme:dark; } }
:root[data-theme="dark"]{ --bg:#0F1411; --panel:#18201B; --panel-2:#202A23; --line:#2E3A32; --fg:#ECF1EC; --muted:#98A59C;
  --accent:#F2643B; --accent-fg:#1A0A04; --def:#7AA8F2; --ball:#F5A04A; color-scheme:dark; }
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 28px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:800;font-size:1.65rem;line-height:1;display:flex;align-items:center;gap:8px}
.brand i{width:24px;height:24px;border-radius:50%;background:var(--accent);flex:none;box-shadow:inset 0 0 0 5px var(--accent),inset 0 0 0 7px var(--accent-fg)}
.top .sp{flex:1}
.pill{font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:3px 9px;background:var(--panel-2);color:var(--muted);border:1px solid var(--line)}
.pill.pro{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:8px 14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.dark{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.btn.ic{width:44px;padding:0;font-size:1.1rem}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.name{font-family:var(--display);font-weight:700;font-size:1.6rem;border:1px solid transparent;background:transparent;border-radius:8px;padding:2px 6px;width:100%;min-width:0}
.name:hover,.name:focus{border-color:var(--line);background:var(--panel)}
.stage{position:relative}
canvas#court{width:100%;height:auto;display:block;border-radius:16px;touch-action:none;background:var(--court);box-shadow:0 1px 0 var(--line)}
.help{position:absolute;left:12px;right:12px;bottom:12px;display:flex;justify-content:center;pointer-events:none}
.help span{background:rgba(21,28,23,.82);color:#F4F2EC;border-radius:999px;padding:7px 14px;font-size:.88rem;font-weight:600;text-align:center;max-width:100%}
.float{position:absolute;top:10px;right:10px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100% - 20px)}
.readQ{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);width:min(92%,460px);background:rgba(21,28,23,.94);color:#F4F2EC;border-radius:16px;padding:14px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.readQ b{display:block;font-family:var(--display);font-size:1.25rem;margin-bottom:8px}
.readQ .opts{display:grid;gap:6px}
.readQ button{text-align:left;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:inherit;border-radius:10px;padding:10px 12px;font:600 .92rem Inter,system-ui,sans-serif;cursor:pointer}
.readQ button:hover{border-color:var(--accent)}
.readQ button.ok{border-color:#2FA35B;background:rgba(47,163,91,.25)}
.readQ button.ko{border-color:#E0481F;background:rgba(224,72,31,.22)}
.reads{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:.82rem;color:var(--muted)}
.reads .chip{font-size:.8rem}
.float .btn{min-height:38px;background:rgba(255,255,255,.88);color:#151C17;border-color:rgba(0,0,0,.12);font-size:.88rem;padding:6px 10px}
.float .btn.on{background:var(--def);color:#fff;border-color:var(--def)}
.steps{display:flex;gap:8px;align-items:center;overflow-x:auto;padding:2px}
.steps .st{flex:none;min-width:84px;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:0 12px;text-align:left}
.steps .st b{font-family:var(--display);font-size:1.15rem;line-height:1}
.steps .st small{font-size:.7rem;color:var(--muted)}
.steps .st.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.steps .st.on small{color:inherit;opacity:.7}
.steps .add{flex:none;height:48px;border-radius:12px;border:2px dashed var(--accent);background:transparent;color:var(--accent);font-weight:700;padding:0 14px}
.note{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:10px 12px;resize:none;min-height:44px}
.actions{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:8px}
.actions .btn{min-height:56px;font-size:1rem}
@media (max-width:520px){ .actions{grid-template-columns:1fr 1fr} .actions .b3d{grid-column:1 / -1;order:-1} }
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:30;padding:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){ .sheet{align-items:center} }
.sheet .in{background:var(--panel);border-radius:20px;max-width:760px;width:100%;max-height:90vh;overflow:auto;padding:18px;border:1px solid var(--line)}
.sheet h2{font-family:var(--display);font-size:1.8rem;margin:0 0 4px}
.sheet .sub{color:var(--muted);margin:0 0 12px;font-size:.92rem}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:8px 0 18px}
.gal button{border:1px solid var(--line);background:var(--panel-2);border-radius:14px;padding:8px;text-align:left;display:flex;flex-direction:column;gap:6px}
.gal canvas{width:100%;height:auto;border-radius:10px;display:block}
.gal b{font-size:.9rem;line-height:1.2}
.gal small{color:var(--muted);font-size:.75rem}
.gal .lk{color:var(--accent);font-weight:700}
.sec{font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:6px 0 0}
.choice{display:grid;gap:10px;margin-top:6px}
.choice button{border:1px solid var(--line);background:var(--panel-2);border-radius:14px;padding:14px;text-align:left;display:grid;grid-template-columns:44px 1fr;gap:4px 12px;align-items:center}
.choice button i{grid-row:span 2;font-style:normal;font-size:1.7rem;text-align:center}
.choice button b{font-size:1.02rem}
.choice button small{color:var(--muted)}
.choice button.star{border-color:var(--accent)}
.v3d{display:flex;flex-direction:column;gap:10px;align-items:center}
.v3d canvas{width:min(100%,440px);max-width:100%;}
.v3d canvas.h{width:100%;height:auto;border-radius:14px;background:#0B0F0D;display:block}
.v3d .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.cap3d{min-height:2.6em;text-align:center;margin:0;font-weight:600;font-size:.95rem;max-width:430px}
.vrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;justify-content:center;margin:2px 0}
.vrow span{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-right:2px}
.chip{border:1px solid var(--line);background:var(--panel-2);border-radius:999px;padding:7px 12px;font-weight:600;font-size:.86rem;min-height:36px}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.sw{width:38px;height:38px;border-radius:50%;border:2px solid transparent;background:transparent;padding:2px}
.sw i{display:block;width:100%;height:100%;border-radius:50%}
.sw.on{border-color:var(--fg)}
.price{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
@media (max-width:520px){ .price{grid-template-columns:1fr} }
.price div{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--panel-2)}
.price div.p{border-color:var(--accent)}
.price ul{margin:6px 0 0;padding-left:18px;line-height:1.6;font-size:.9rem}
.price b{font-family:var(--display);font-size:1.3rem}
input.key{width:100%;border:1px solid var(--line);background:var(--panel-2);border-radius:10px;padding:10px;margin-top:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:40;font-weight:600;max-width:90vw;text-align:center}
.bar{height:8px;border-radius:99px;background:var(--panel-2);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;width:0;background:var(--accent)}
.hint{font-size:.86rem;color:var(--muted);line-height:1.45}
.nameRow{display:flex;gap:8px;align-items:center}
.nameRow .btn{flex:none}
.rowb{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
.info{border:1px solid var(--line);background:var(--panel-2);border-radius:14px;padding:12px 14px;margin:4px 0 8px;font-size:.9rem;line-height:1.5}
.info ul{margin:6px 0;padding-left:18px}
.info a{color:var(--accent);font-weight:600}
.coachList{display:grid;gap:8px}
.coachCard{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--panel-2);border-radius:16px;padding:12px 14px;cursor:pointer;color:var(--fg);border-left:5px solid var(--cc)}
.coachCard:hover{border-color:var(--cc)}
.mono{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:var(--cc);color:#fff;font-family:var(--display);font-weight:800;font-size:1.15rem;letter-spacing:.02em}
.mono.big{width:72px;height:72px;font-size:1.8rem}
.cc{display:flex;flex-direction:column;gap:2px;min-width:0}
.cc b{font-family:var(--display);font-size:1.25rem;line-height:1.1}
.cc small{color:var(--muted);font-size:.8rem}
.cc em{font-style:normal;font-size:.86rem;line-height:1.35}
.cn{display:flex;flex-direction:column;align-items:center;font-family:var(--display);font-weight:800;font-size:1.5rem;color:var(--cc);line-height:1}
.cn small{font-family:inherit;font-size:.62rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.coachHero{display:flex;gap:16px;align-items:center;margin:12px 0 6px;padding:16px;border-radius:18px;background:linear-gradient(120deg,color-mix(in srgb,var(--cc) 22%,transparent),transparent 70%);border:1px solid var(--line)}
.coachHero small{font-size:.68rem;font-weight:800;letter-spacing:.12em;color:var(--cc)}
.coachHero h3{font-family:var(--display);font-size:2rem;line-height:1;margin:2px 0}
.coachHero p{margin:0;color:var(--muted);font-size:.88rem}
.coachIdea{font-size:1rem;font-weight:600;line-height:1.4;margin:10px 0}
.adn{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.adn span{border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-size:.8rem;font-weight:600;background:var(--panel-2)}
.cstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:6px 0 4px}
.cstats div{border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--panel-2)}
.cstats b{display:block;font-family:var(--display);font-size:1.9rem;line-height:1}
.cstats small{color:var(--muted);font-size:.78rem;line-height:1.35}
.princ{margin:4px 0 6px;padding-left:22px;line-height:1.5;font-size:.92rem}
.hint a{color:var(--accent)}
.coachH{font-family:var(--display);font-size:1.4rem;margin:12px 0 2px}
.choice button b small{font-weight:500;color:var(--muted)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){ .form{grid-template-columns:1fr} }
.form label{display:flex;flex-direction:column;gap:5px;font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);min-width:0}
.form label.w{grid-column:1 / -1}
.form label em{font-style:normal;font-weight:500;letter-spacing:0;text-transform:none}
.form input,.form select,.form textarea{border:1px solid var(--line);background:var(--panel-2);border-radius:10px;padding:9px 10px;font-size:.95rem;font-weight:500;letter-spacing:0;text-transform:none;color:var(--fg);resize:vertical;min-height:42px;width:100%}
body.quiz .top .btn, body.quiz .top button, body.quiz .nameRow .btn, body.quiz .float, body.quiz #steps, body.quiz #reads, body.quiz #note, body.quiz .actions, body.quiz .help{display:none!important}
body.quiz .name{pointer-events:none}
body.quiz #planPill{display:none}
.chip.dim{opacity:.45}
.pasos{margin:6px 0 4px;padding-left:22px;line-height:1.55;font-size:.92rem}
</style>

<div class="app">
  <header class="top">
    <div class="brand"><i aria-hidden="true"></i>Extra Pass</div>
    <span class="pill" id="planPill">Gratis</span>
    <span class="sp"></span>
    <button class="btn" id="libBtn">📚 Mis jugadas</button>
    <button class="btn" id="proBtn">Pro</button>
  </header>

  <div class="nameRow"><input class="name" id="pName" aria-label="Nombre de la jugada" maxlength="50"><button class="btn" id="fichaBtn">📋 Ficha</button></div>

  <div class="stage">
    <canvas id="court" width="1344" height="1232" aria-label="Media pista. Arrastra a una jugadora para moverla y arrastra el balón hasta una compañera para pasar."></canvas>
    <div class="float">
      <button class="btn" id="defBtn" aria-pressed="false">✕ Defensa</button>
      <button class="btn" id="covBtn" hidden>🛡 Bloqueo: Auto</button>
      <button class="btn" id="undoBtn" aria-label="Deshacer">↶</button>
    </div>
    <div class="help"><span id="help"></span></div>
    <div class="readQ" id="readQ" hidden></div>
  </div>

  <div class="steps" id="steps"></div>
  <div class="reads" id="reads" hidden></div>
  <textarea class="note" id="note" rows="1" maxlength="120" placeholder="Explica este paso en una frase (sale en el vídeo)"></textarea>

  <div class="actions">
    <button class="btn" id="playBtn">▶ Ver</button>
    <button class="btn pri b3d" id="v3dBtn">🏀 Ver con jugadores 3D</button>
    <button class="btn dark" id="shareBtn">Compartir</button>
  </div>
</div>

<div class="sheet" id="sheet" hidden><div class="in" id="sheetIn" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>

const OFF = ["o1","o2","o3","o4","o5"];
function mk(name, cat, init, ball, list, note0){
  const s0 = {pos:{}, ball, moves:{}, note:note0 || ""}; OFF.forEach(id => s0.pos[id] = init[id]);
  const out = [s0];
  (list || []).forEach(st => { const prev = out[out.length-1], s = {pos:clone(prev.pos), ball:st.ball || prev.ball, moves:{}, note:st.note || "", shot:!!st.shot};
    Object.entries(st.mv || {}).forEach(([id, v]) => { s.pos[id] = [v[0], v[1]]; if(v[2]) s.moves[id] = v[2]; }); if(st.zd) s.zd = st.zd; if(st.dd) s.dd = st.dd; out.push(s); });
  return {id:"b_"+name.toLowerCase().normalize("NFD").replace(/[^a-z0-9]+/g,"_"), name, cat, def:true, steps:out};
}

}
function footer(c, W, H, wm, pg){ const U = W/1240, m = 70*U; c.textBaseline = "alphabetic";
  c.fillStyle = MUTE; c.font = "600 "+17*U+"px "+FB; c.textAlign = "left"; c.fillText(wm ? "Hecho con "+BRAND+" · versión gratis" : BRAND, m, H - 40*U);
  if(pg){ c.textAlign = "right"; c.fillText(String(pg), W - m, H - 40*U); } c.textAlign = "left"; }
function pageCanvas(w, h){ const c = document.createElement("canvas"); c.width = w; c.height = h; const g = c.getContext("2d"); g.fillStyle = PAPER; g.fillRect(0, 0, w, h); return [c, g]; }
function renderPlay(p, fmt, wm, pg){
  if(fmt === "a4"){ const n = p.steps.length, room = 1754 - 90; let t, used;
    for(const cols of (n <= 4 ? [2, 3, 4] : [3, 4])){ const [tc, g] = pageCanvas(1240, 4000); t = tc; used = playPage(g, 1240, p, {cols, num:pg}); if(used <= room) break; }
    const [c, g2] = pageCanvas(1240, 1754);
    if(used <= room) g2.drawImage(t, 0, 0, 1240, room, 0, 0, 1240, room);
    else { const k = room/used, w = 1240*k; g2.fillStyle = INK; g2.fillRect(0, 0, 1240, 184*k); g2.drawImage(t, 0, 0, 1240, used, (1240 - w)/2, 0, w, room); }
    footer(g2, 1240, 1754, wm, pg); return c; }
  const [t, g] = pageCanvas(1080, 6000), U = 1080/1240, used = playPage(g, 1080, p, {cols:2, mobile:true}) + 110*U;
  const [c, g2] = pageCanvas(1080, Math.ceil(used)); g2.drawImage(t, 0, 0); footer(g2, 1080, c.height, wm); return c;
}
function renderCover(list, title, fmt){
  const W = fmt === "a4" ? 1240 : 1080, H = fmt === "a4" ? 1754 : 1920, U = W/1240, m = 70*U, [c, g] = pageCanvas(W, H);

  g.fillStyle = "rgba(244,242,236,.7)"; g.font = "600 "+28*U+"px "+FB; g.fillText(list.length+" jugadas · "+new Date().toLocaleDateString("es-ES", {month:"long", year:"numeric"}), m, 370*U);
  let y = 620*U; g.fillStyle = INK; g.font = "800 "+34*U+"px "+FD; g.fillText("ÍNDICE", m, y); y += 26*U;
  const cats = []; list.forEach((p, i) => { let k = cats.find(x => x.c === p.cat); if(!k) cats.push(k = {c:p.cat, items:[]}); k.items.push([p, i + 2]); });
  cats.forEach(k => { y += 44*U; g.fillStyle = ACC; g.font = "800 "+20*U+"px "+FB; g.fillText((k.c || "").toUpperCase(), m, y);
    k.items.forEach(([p, pg]) => { y += 40*U; if(y > H - 120*U) return; g.fillStyle = INK; g.font = "500 "+24*U+"px "+FB; g.fillText(p.name, m, y);
      g.textAlign = "right"; g.fillStyle = MUTE; g.fillText(fmt === "a4" ? String(pg) : "", W - m, y); g.textAlign = "left"; }); });

}

    for(let i = 0; i < n; i++){ const st = p.steps[i]; for(let a = 0; a < 5; a++) for(let b = a+1; b < 5; b++){ const A = OFF[a], B = OFF[b], d = dist(st.pos[A], st.pos[B]);
      const scr = (st.moves && (st.moves[A] === "screen" || st.moves[B] === "screen")) || (i > 0 && (moveType(i, A) === "screen" || moveType(i, B) === "screen"));
      if(d < 30 && !scr && !(passOf(i) && ((passOf(i).from === A && passOf(i).to === B) || (passOf(i).from === B && passOf(i).to === A)) && d > 12) && i > 0 && i < n - 1 && !(st.moves && Object.values(st.moves).includes("screen"))) out.push("espaciado: "+num(A)+" y "+num(B)+" a "+(d/10).toFixed(1)+" m en el paso "+i); } }
    if(/^Zona/.test((p.ficha || {}).defensa || "") && !zoneOf(p)) out.push("contra zona pero la defensa automática es individual");
    return [p.name, out]; })).filter(x => x[1].length), cinfo:() => { const q = counterPlay(play); return q && {n:q.steps.length, u:q._cu, notes:q.steps.map(x => x.note)}; },
  cframe:(i, t, w) => { const q = counterPlay(play); const c = document.createElement('canvas'); c.width = w || 500; c.height = Math.round(c.width*HH/WW); const g = c.getContext('2d'); setView(g, c.width); withPlay(q, () => drawFrame(g, i, t, colors())); return c.toDataURL('image/png'); },
  caudit:() => { const out = {}; for(const cov of ["drop","show","switch","ice","blitz"]){ let bad = 0, worst = 99; ALL.forEach(p0 => { const p = clone(p0); p.def = true; p.cov = cov; const q = counterPlay(p); if(!q) return;
